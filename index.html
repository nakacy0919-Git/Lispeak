<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lispeak</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lispeak</h1>
    <div id="progress">0 / 0</div>
  </header>

  <main id="app-container">
    <!-- Visual Section -->
    <section id="visual-section">
      <img id="question-image" src="" alt="Question Image" />
    </section>

    <!-- Audio Section -->
    <section id="audio-section">
      <audio id="question-audio" controls></audio>
    </section>

    <!-- Answer Section -->
    <section id="answer-section">
      <div class="button-grid">
        <button class="choice-btn" data-choice="1">①</button>
        <button class="choice-btn" data-choice="2">②</button>
        <button class="choice-btn" data-choice="3">③</button>
        <button class="choice-btn" data-choice="4">④</button>
      </div>
    </section>

    <!-- Feedback Section (Hidden initially) -->
    <section id="feedback-section" class="hidden">
      <h2 id="result-title"></h2>
      
      <!-- チャンク再生セクション -->
      <div id="script-container">
        <strong>Script (タップして再生):</strong>
        <div id="audio-script-chunks" class="chunk-container"></div>
      </div>
      
      <p id="feedback-text"></p>

      <!-- 音読・シャドーイングセクション -->
      <div id="shadowing-section">
        <hr class="divider">
        <h3>🎙️ 音読・シャドーイング</h3>
        <p class="instruction">マイクボタンを押してスクリプトを音読してください。正しく発音できた単語が光ります。</p>
        <div id="shadowing-script" class="shadowing-script"></div>
        <button id="mic-btn" class="mic-btn">🎙️ 音読を始める</button>
      </div>

      <button id="next-btn">次の問題へ</button>
    </section>
  </main>

  <!-- 外部スクリプトの読み込み（順番が重要です） -->
  <script src="js/dataLoader.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
