<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lispeak</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <!-- ヘッダー用スモールロゴ -->
    <img src="assets/images/logo.png" alt="Lispeak" class="header-logo" onerror="this.style.display='none'">
    <div id="progress" class="hidden">0 / 0</div>
  </header>

  <main>
    <!-- スタート画面 -->
    <section id="home-screen">
      <!-- メインロゴ -->
      <img src="assets/images/logo.png" alt="Lispeak Logo" class="main-logo" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<h1>Lispeak</h1>');">
      <h2>問題形式を選択してください</h2>
      <div class="category-buttons">
        <button class="category-btn" data-category="illustration">共通テスト イラスト問題</button>
        <!-- 今後、他のカテゴリ（例：図表読み取りなど）を追加できます -->
      </div>
    </section>

    <!-- アプリメインコンテナ（初期は非表示） -->
    <div id="app-container" class="hidden">
      
      <!-- 左カラム（問題・音声・選択肢） -->
      <div class="left-column">
        <section id="visual-section">
          <img id="question-image" src="" alt="Question Image" />
        </section>

        <section id="audio-section">
          <div id="audio-level-container" class="level-container"></div>
          <audio id="question-audio" controls></audio>
        </section>

        <section id="answer-section">
          <div class="button-grid">
            <button class="choice-btn" data-choice="1">①</button>
            <button class="choice-btn" data-choice="2">②</button>
            <button class="choice-btn" data-choice="3">③</button>
            <button class="choice-btn" data-choice="4">④</button>
          </div>
        </section>
      </div>

      <!-- 右カラム（フィードバック・シャドーイング） -->
      <div class="right-column">
        <section id="feedback-section" class="hidden">
          <h2 id="result-title"></h2>
          <div id="script-container">
            <strong>Script (タップして再生):</strong>
            <div id="audio-script-chunks" class="chunk-container"></div>
          </div>
          <p id="feedback-text"></p>

          <div id="shadowing-section">
            <hr class="divider">
            <h3>🎙️ 音読・シャドーイング</h3>
            <p class="instruction">マイクボタンを押してスクリプトを音読してください。正しく発音できた単語が光ります。</p>
            <div id="shadowing-script" class="shadowing-script"></div>
            <button id="mic-btn" class="mic-btn">🎙️ 音読を始める</button>
          </div>

          <button id="next-btn">次の問題へ</button>
        </section>
      </div>

    </div>
  </main>

  <script src="js/dataLoader.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
